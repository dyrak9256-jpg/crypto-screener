# Prometheus для crypto-screener.
# Скрейпит /metrics приложения (сервис app в docker-compose) и самого себя.
# Правила алертов — /etc/prometheus/alerts.yml (см. observability/alerts.yml);
# без Alertmanager алерты видны в UI Prometheus (/alerts) и Grafana (панель «Активные алерты»).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: screener
    metrics_path: /metrics
    static_configs:
      - targets: ["app:9090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
