services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:?DB_NAME is required}?sslmode=disable
      # Нужен TELEGRAM_TOKEN или TELEGRAM_TOKENS (мульти-ботовый режим) —
      # приложение завершится с понятной ошибкой, если не задан ни один.
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_TOKENS: ${TELEGRAM_TOKENS:-}
      ADMIN_CHAT_IDS: ${ADMIN_CHAT_IDS:?ADMIN_CHAT_IDS is required}
      HARD_MIN_SPREAD: ${HARD_MIN_SPREAD:-0.01}
      FEES: ${FEES:-}
      METRICS_ADDR: ${METRICS_ADDR:-:9090}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Метрики/статус: /metrics, /healthz, /api/status, /debug/pprof/
      - "9090:9090"
    stop_grace_period: 90s

volumes:
  pgdata:
