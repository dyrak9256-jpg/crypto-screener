services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:?DB_NAME is required}?sslmode=disable
      # Нужен TELEGRAM_TOKEN или TELEGRAM_TOKENS (мульти-ботовый режим) —
      # приложение завершится с понятной ошибкой, если не задан ни один.
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_TOKENS: ${TELEGRAM_TOKENS:-}
      ADMIN_CHAT_IDS: ${ADMIN_CHAT_IDS:?ADMIN_CHAT_IDS is required}
      HARD_MIN_SPREAD: ${HARD_MIN_SPREAD:-0.01}
      FEES: ${FEES:-}
      METRICS_ADDR: ${METRICS_ADDR:-:9090}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Метрики/статус: /metrics, /healthz, /api/status, /debug/pprof/
      - "127.0.0.1:9090:9090"
    stop_grace_period: 90s

  # Наблюдение: скрейпит app:9090/metrics, правила алертов — observability/alerts.yml.
  # UI: http://localhost:9091 (алерты — /alerts).
  prometheus:
    image: prom/prometheus:v3.13.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - app

  # Алерты → вебхук приложения (app:9090/alerts) → Telegram админам.
  # UI: http://localhost:9093.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - app

  # Дашборд crypto-screener автозагружается из observability/grafana/dashboards.
  # UI: http://localhost:3000 (admin / ${GRAFANA_ADMIN_PASSWORD:-admin}).
  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Просмотр дашборда без входа (только чтение).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafana_data:
